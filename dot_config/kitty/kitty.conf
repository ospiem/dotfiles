# =============================================================================
# ~/.config/kitty/kitty.conf
#
# Panes: Alt. Tabs: Cmd. Everything else: kitty defaults.
# Reload: Ctrl+Shift+F5      Debug: kitty --debug-config / --debug-keyboard
# =============================================================================

# ── Font ──────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font Mono
font_size        15.0
modify_font cell_height 110%

# "JetBrainsMono Nerd Font Mono" is already patched and carries the PUA ranges.
# The old symbol_map only shadowed JetBrains' own glyphs with Symbols Nerd Font
# for no gain. Restore it if boxes ever show up instead of icons:
#symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD Symbols Nerd Font Mono

# ── Theme ─────────────────────────────────────────────
# `kitten themes` picks a palette, writes current-theme.conf and adds the include
# itself. Kept commented here because including a missing file errors at startup.
#
# Why it matters: kitty defines the 16 ANSI colours that BAT_THEME=ansi, vivid's
# LS_COLORS, eza, fzf-tab and fast-syntax-highlighting all sit on. Keep it in the
# same family as `vivid generate <theme>` in .zshrc.
#include current-theme.conf

# ── Appearance ────────────────────────────────────────
# Declared AFTER the theme include: kitty applies options top to bottom and the
# last declaration wins, so this background survives a theme switch.
# background                 #0f0f0f
background_opacity         0.88
dynamic_background_opacity yes          # Ctrl+Shift+A → m / l / 1 on the fly

hide_window_decorations    titlebar-only
tab_bar_edge               bottom
tab_bar_style              powerline

cursor_trail               3
cursor_trail_decay         0.1 0.4

# ── Behavior ──────────────────────────────────────────
enable_audio_bell          no
scrollback_lines           100000
confirm_os_window_close    1

# Notify when a command ran longer than this and the window is not focused.
# Works through shell integration, which is enabled by default.
notify_on_cmd_finish       unfocused 120.0

# Both Option keys act as Alt, which the alt+ mappings below need.
# Karabiner-Elements is installed: if it swallows Option, those bindings stop
# working silently — diagnose with `kitty --debug-keyboard`.
macos_option_as_alt        yes

# So that launch and kittens find Homebrew binaries.
exe_search_path /opt/homebrew/bin

# `shell_integration enabled` omitted on purpose — that is the default.

# ── Remote control ────────────────────────────────────
# Needed by smart-splits.nvim for one set of hjkl bindings across kitty panes and
# Neovim splits. socket-only is the safe variant: commands are accepted over the
# unix socket only, not through escape sequences that any program running inside
# the terminal could emit.
allow_remote_control       socket-only
listen_on                  unix:/tmp/kitty

# ── Panes: Alt. Tabs: Cmd. Everything else: defaults ──
enabled_layouts splits,stack

# --allow-fallback=shifted,ascii mirrors what kitty's own shortcuts do:
#   shifted — fall back to the character produced with Shift held
#   ascii   — fall back to the US layout for that physical key
# The ascii fallback only kicks in for keys whose codepoint is above 127, so
# Dvorak and Colemak are unaffected while Cyrillic is covered. Custom mappings
# default to `shifted` only, which is why the flag is needed on cmd+t as well.
map --allow-fallback=shifted,ascii alt+v launch --location=vsplit --cwd=current
map --allow-fallback=shifted,ascii alt+s launch --location=hsplit --cwd=current

map --allow-fallback=shifted,ascii alt+h neighboring_window left
map --allow-fallback=shifted,ascii alt+j neighboring_window down
map --allow-fallback=shifted,ascii alt+k neighboring_window up
map --allow-fallback=shifted,ascii alt+l neighboring_window right

# Same thing on the arrows. Arrows carry no character, so no fallback flag is
# needed — and nothing in .zshrc binds Option+Arrow, so kitty may swallow them.
map alt+left  neighboring_window left
map alt+down  neighboring_window down
map alt+up    neighboring_window up
map alt+right neighboring_window right

# Zoom active pane (toggle stack layout)
map --allow-fallback=shifted,ascii alt+z toggle_layout stack

# Resize the active pane. No clash with Option+Shift+F / Option+Shift+B from zsh:
# different letters.
map --allow-fallback=shifted,ascii alt+shift+h resize_window narrower
map --allow-fallback=shifted,ascii alt+shift+l resize_window wider
map --allow-fallback=shifted,ascii alt+shift+k resize_window taller
map --allow-fallback=shifted,ascii alt+shift+j resize_window shorter
map --allow-fallback=shifted,ascii alt+shift+0 resize_window reset

# ── Tabs on Cmd ───────────────────────────────────────
# {title} is set by shell integration and already holds the running command or
# the current directory. Alternative: tab_title_template "{sup.index} {tab.active_exe}"
tab_title_template "{sup.index} {title}"

# A letter key needs the fallback flag.
# Digits are layout independent, so cmd+1..9 work without it.
map --allow-fallback=shifted,ascii cmd+t new_tab_with_cwd

map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# ── Clipboard with non-Latin layouts ──────────────────
# The ascii fallback is unreliable with Cmd on macOS, so map the
# physical keys directly as well. The two Cyrillic keys below are the actual
# characters produced by the Russian layout — do not "translate" them.
map --allow-fallback=shifted,ascii cmd+c copy_to_clipboard
map --allow-fallback=shifted,ascii cmd+v paste_from_clipboard
map cmd+с copy_to_clipboard
map cmd+м paste_from_clipboard

# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME

# ── Pane separation ───────────────────────────────────
# Strictly AFTER the theme include: Catppuccin sets its own *_border_color and
# the last declaration wins.

# A non-zero margin cancels draw_minimal_borders and makes kitty draw a full
# border around every pane instead of just the divider between neighbours.
window_margin_width        2
window_padding_width       6
window_border_width        2pt

active_border_color        #CBA6F7   # mauve — same accent as the active tab
inactive_border_color      #313244   # surface0 — almost blends into the background

# The strongest "where am I" cue: text in inactive panes is dimmed.
inactive_text_alpha        0.7
